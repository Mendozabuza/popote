<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FBF7EF">
<meta name="description" content="Popote : menus de la semaine selon ton budget, liste de courses Lidl, frigo et recettes en photos.">
<title>Popote</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Popote">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Carnet de cuisine : pages de papier, encre brune, photos scotchées, une seule couleur vive (tomate) */
:root{
  --paper:#FBF7EF;--card:#FFFDF8;--ink:#2A2420;--ink2:#665A4E;--line:#E4DACB;--rule:#CDBFA9;
  --accent:#B0502C;--on-accent:#FFFFFF;--accent-soft:#F6E3D6;--herb:#3F6E2F;--herb-soft:#E3EDD9;
  --warn:#8F5A0A;--warn-soft:#F7EBCF;--bad:#A8332A;--bad-soft:#F6DEDA;--tape:rgba(214,190,140,.62);--shade:rgba(42,36,32,.10);
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;--f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;--f-hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --r:10px;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:1.6rem}h3{font-size:1.15rem}
p{margin:0}
.muted{color:var(--ink2)}.small{font-size:.9rem}.hand{font-family:var(--f-hand);font-size:1.35rem;line-height:1.1}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--paper);border-bottom:1.5px solid var(--ink);display:flex;align-items:flex-end;gap:16px;padding-block:14px 10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:2.1rem;letter-spacing:-.01em}
.brand .hand{color:var(--accent)}
.sync{margin-left:auto;font-size:.85rem;color:var(--ink2);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--rule);display:inline-block}
.sync.ok i{background:var(--herb)}.sync.err i{background:var(--bad)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;width:100%}
nav.tabs button{font:inherit;font-size:.98rem;background:none;border:0;border-bottom:3px solid transparent;color:var(--ink2);padding:8px 10px;min-height:44px;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
@media (max-width:640px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1.5px solid var(--ink);justify-content:space-around;gap:0;padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  nav.tabs button{flex:1;font-size:.82rem;padding:6px 2px;border-bottom:0;border-top:3px solid transparent}
  nav.tabs button[aria-selected="true"]{border-top-color:var(--accent)}
  .brand h1{font-size:1.8rem}
  header.top{position:static}
  .filters .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
  .filters .chip{flex:none}
}
section.view{padding-top:22px;display:grid;gap:22px}
.btn{font:inherit;font-weight:700;font-size:.95rem;min-height:44px;padding:9px 16px;border-radius:6px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;text-decoration:none}
.btn:hover{background:var(--accent-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:none;font-weight:400;text-decoration:underline;text-underline-offset:3px;padding-inline:8px}
.btn.sm{min-height:36px;padding:5px 10px;font-size:.88rem}
.btn[aria-pressed="true"]{background:var(--herb-soft);border-color:var(--herb);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.page{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:20px;box-shadow:0 1px 0 var(--line),0 3px 0 -1px var(--card),0 4px 0 -1px var(--line)}
.page>h3,.page>h2{margin-bottom:10px}
.dash{border:0;border-top:1.5px dashed var(--rule);margin:14px 0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--rule);border-radius:6px;padding:8px 10px;min-height:44px;max-width:100%}
input:focus,select:focus{border-color:var(--accent)}
label.f{display:grid;gap:4px;font-size:.92rem;color:var(--ink2)}
label.f>span{font-weight:700;color:var(--ink)}
.grid-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:.9rem;min-height:38px;padding:6px 12px;border-radius:99px;border:1.5px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.tag{font-size:.8rem;padding:2px 8px;border-radius:99px;background:var(--paper);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.tag.veg{background:var(--herb-soft);border-color:transparent;color:var(--herb)}
.tag.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
/* photo scotchée */
.photo{position:relative;background:var(--paper);padding:6px 6px 6px;border:1px solid var(--line);box-shadow:0 2px 6px var(--shade)}
.photo img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--line)}
.photo::before{content:"";position:absolute;top:-9px;left:50%;width:64px;height:20px;margin-left:-32px;background:var(--tape);transform:rotate(-3deg)}
/* résumé */
.tape-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.stat{padding:12px 14px;border-left:3px solid var(--ink);background:var(--card)}
.stat b{display:block;font-family:var(--f-display);font-size:1.6rem;font-weight:600}
.stat.over{border-color:var(--bad)}.stat.over b{color:var(--bad)}
.stat.warn{border-color:var(--warn)}.stat.ok{border-color:var(--herb)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--herb)}
.bar.over i{background:var(--bad)}.bar.warn i{background:var(--warn)}
/* semaine */
.days{display:grid;gap:18px}
.day{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;padding-bottom:18px;border-bottom:1.5px dashed var(--rule)}
.day h3{font-size:1.25rem}.day .hand{color:var(--ink2);font-size:1.15rem}
.meals{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.meal{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;background:var(--card);border:1px solid var(--line);padding:10px;border-radius:4px;align-items:start}
.meal.done{opacity:.72}
.meal img{width:84px;height:84px;object-fit:cover;display:block;background:var(--line)}
.meal .lbl{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2)}
.meal .t{font-family:var(--f-display);font-weight:600;font-size:1.02rem;line-height:1.2;background:none;border:0;padding:0;color:var(--ink);text-align:left;cursor:pointer;font-size:1.02rem}
.meal .t:hover{text-decoration:underline}
.meal .acts{display:flex;gap:2px;flex-wrap:wrap;margin-top:6px;grid-column:1/-1}
.meal .acts .btn{min-height:34px;padding:4px 8px;font-size:.84rem;font-weight:400;border-color:var(--line)}
.meal.empty{grid-template-columns:1fr;border-style:dashed;color:var(--ink2)}
@media (max-width:640px){.day{grid-template-columns:1fr;gap:8px}}
/* recettes */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:26px 20px}
.rcard{background:none;border:0;padding:0;text-align:left;color:var(--ink);font:inherit;cursor:pointer;display:grid;gap:8px;align-content:start}
.rcard:nth-child(3n+1) .photo{transform:rotate(-.6deg)}.rcard:nth-child(3n+2) .photo{transform:rotate(.5deg)}
.rcard h3{font-size:1.08rem}
.rcard .meta{display:flex;gap:6px;flex-wrap:wrap}
.rcard:hover h3{text-decoration:underline}
.filters{display:grid;gap:12px}
.search{width:100%}
/* courses */
.ticket{max-width:640px;background:var(--card);border:1px solid var(--line);padding:20px 22px;font-variant-numeric:tabular-nums;justify-self:start;width:100%}
.ticket h4{font-family:var(--f-body);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin:16px 0 6px;border-bottom:1.5px dashed var(--rule);padding-bottom:4px}
.li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:6px 0}
.li input{width:22px;height:22px;min-height:0;margin:2px 0 0;accent-color:var(--herb)}
.li.on .nm{text-decoration:line-through;color:var(--ink2)}
.total{display:flex;justify-content:space-between;font-family:var(--f-display);font-size:1.4rem;border-top:1.5px solid var(--ink);margin-top:14px;padding-top:10px}
/* frigo */
.stock{display:grid;gap:4px}
.sitem{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.sitem input{min-height:38px;width:100%}
.hitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.hitem .ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;grid-column:1/-1}
.hitem .ctl input{width:84px;min-height:38px}
.hitem .ctl select{min-height:38px;width:auto}
.scanrow{display:grid;gap:6px;padding:10px 0;border-bottom:1px dashed var(--line)}
.scanrow input{min-height:40px}
/* fiche recette */
#modal{position:fixed;inset:0;z-index:30;background:rgba(20,16,12,.55);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#sheet{background:var(--card);color:var(--ink);width:100%;max-width:820px;border-radius:4px;padding:22px;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#sheet .x{position:absolute;top:10px;right:10px;z-index:2}
.rhead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:start}
.rhead .photo{transform:rotate(-1deg);margin-top:10px}
@media (max-width:700px){.rhead{grid-template-columns:1fr}}
.rtitle{font-size:1.9rem;margin:6px 0 4px;padding-right:80px}
.timings{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1.5px solid var(--ink);margin:12px 0}
.timings div{padding:8px;border-right:1px solid var(--rule);text-align:center}
.timings div:last-child{border-right:0}
.timings small{display:block;color:var(--ink2);font-size:.7rem;text-transform:uppercase;letter-spacing:.04em}
.timings b{font-family:var(--f-display);font-size:1.1rem}
.macros{display:flex;gap:16px;flex-wrap:wrap;font-size:.92rem}
.macros b{font-family:var(--f-display);font-size:1.15rem}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--ink);border-radius:6px}
.stepper button{font:inherit;font-size:1.2rem;width:44px;height:42px;background:none;border:0;color:var(--ink);cursor:pointer}
.stepper span{min-width:96px;text-align:center;font-weight:700}
.rbody{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr);gap:28px;margin-top:22px}
@media (max-width:700px){.rbody{grid-template-columns:1fr}}
.ings{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:2px}
.ings li{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.ings .q{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.ings .have{color:var(--herb);font-size:.82rem}
ol.steps{padding:0;margin:8px 0 0;list-style:none;counter-reset:s;display:grid;gap:14px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px}
ol.steps li::before{content:counter(s);font-family:var(--f-hand);font-size:1.7rem;line-height:1;color:var(--accent);text-align:center}
.note{background:var(--warn-soft);color:var(--ink);padding:10px 12px;border-radius:4px;font-size:.92rem}
.note.green{background:var(--herb-soft)}
.credit{font-size:.82rem;color:var(--ink2);margin-top:18px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:6px;max-width:calc(100% - 32px)}
.empty-state{text-align:center;padding:30px 10px;display:grid;gap:12px;justify-items:center}
.skel{height:220px;background:linear-gradient(90deg,var(--line),var(--card),var(--line));background-size:200% 100%;animation:sk 1.4s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rcard .photo,.rhead .photo{transform:none!important}}
table.prices{width:100%;border-collapse:collapse;font-size:.92rem}
table.prices td,table.prices th{padding:6px 4px;border-bottom:1px dashed var(--line);text-align:left}
table.prices input{width:90px;min-height:36px}
.scroll{overflow-x:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="brand"><h1>Popote</h1><span class="hand">mon carnet de cuisine de la semaine</span></div>
  <div class="sync ok" id="sync"><i aria-hidden="true"></i><span>Données privées</span></div>
  <nav class="tabs" aria-label="Sections">
    <button data-tab="semaine" aria-selected="true">Semaine</button>
    <button data-tab="courses" aria-selected="false">Courses</button>
    <button data-tab="recettes" aria-selected="false">Recettes</button>
    <button data-tab="frigo" aria-selected="false">Frigo</button>
    <button data-tab="maison" aria-selected="false">Maison</button>
    <button data-tab="profil" aria-selected="false">Profil</button>
  </nav>
</header>

<main>
<section class="view" id="v-semaine"></section>
<section class="view" id="v-courses" hidden></section>
<section class="view" id="v-recettes" hidden></section>
<section class="view" id="v-frigo" hidden></section>
<section class="view" id="v-maison" hidden></section>
<section class="view" id="v-profil" hidden></section>
</main>
</div>
<div id="modal" hidden><div id="sheet" role="dialog" aria-modal="true" aria-label="Fiche recette"></div></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="app.js"></script>
</body>
</html>
